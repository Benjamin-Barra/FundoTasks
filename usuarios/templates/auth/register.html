{% extends 'base.html' %}

{% block sidebar %}{% endblock %}
{% block header %}{% endblock %}

{% block content %}
<div class="max-w-sm mx-auto mt-24 bg-white border border-slate-200 rounded-2xl p-6 shadow-sm">
    <h1 class="text-xl font-extrabold mb-4">Crear cuenta</h1>
    <form method="post" class="space-y-3">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit"
            class="w-full bg-emerald-600 text-white font-bold rounded-xl py-2 hover:bg-emerald-500">
            Registrarse
        </button>
    </form>
    <a href="{% url 'usuarios:login' %}" class="text-sm text-emerald-700 mt-3 block">Ya tengo cuenta</a>
</div>
{% endblock %}
